image:
  repository: ghcr.io/tan90degrees/dataflowcore
  tag: "0.9.0"
  pullPolicy: IfNotPresent
  digest: ""
# Existing Secret key: database-url.
existingSecret: dataflowcore-secrets
# Existing ReadWriteMany PVC, mounted at the same absolute path in all Pods.
existingDataClaim: dataflowcore-data
leaseSeconds: 30
worker:
  replicas: 2
  pool: default
  runtimeVersion: "0.9.0"
  # auto: one slot without GIL; with GIL, one resident file process per CPU (up to 256).
  slots: auto
  cpu: 2
  memoryMB: 1024
  interval: 2
  stopGrace: 5
  # auto: one CPU DAG branch per slot with GIL, otherwise up to eight.
  runnerDagWorkers: auto
  runnerMapWorkers: 4
  runnerMaxTasks: 100
  runnerIoWorkers: 16
  runnerIoMapWorkers: 16
  ioConcurrency: 32
  resourceAgingSeconds: 2
  resources:
    requests: {cpu: "2", memory: "1536Mi"}
    limits: {cpu: "2", memory: "1536Mi"}
  nodeSelector: {}
  tolerations: []
control:
  maxUnfinished: 10000
  dbTimeoutMS: 5000
  uploadMinFreeBytes: 67108864
  # Relative to /dataflow, or an absolute directory inside that shared volume.
  uploadDir: uploads
  uploadMaxBytes: 268435456
  uploadConcurrency: 4
  uploadTimeout: 300
  resources:
    requests: {cpu: "250m", memory: "256Mi"}
    limits: {cpu: "1", memory: "512Mi"}

# Optional independently built static console + same-origin API reverse proxy.
console:
  enabled: false
  image:
    repository: ghcr.io/tan90degrees/dataflowcore-console
    tag: "0.7.0"
    pullPolicy: IfNotPresent
    digest: ""
  resources:
    requests: {cpu: "50m", memory: "32Mi"}
    limits: {cpu: "250m", memory: "128Mi"}
# Only needed for a browser calling the control API directly across origins.
corsOrigins: []
workerDisruptionBudget:
  enabled: false
  minAvailable: 1
networkPolicy:
  enabled: false
  # Additional peers for direct API clients or an Ingress controller.
  controlIngressPeers: []
ingress:
  enabled: false
  className: ""
  host: dataflow.example.com
  tlsSecret: ""
monitoring:
  enabled: false
  # Requires Prometheus Operator CRDs.
  labels: {}
