image:
  repository: ghcr.io/tan90degrees/dataflowcore
  tag: "0.3.0"
  pullPolicy: IfNotPresent
# Existing Secret keys: database-url, admin-token, worker-token.
existingSecret: dataflowcore-secrets
# Existing ReadWriteMany PVC, mounted at the same absolute path in all Pods.
existingDataClaim: dataflowcore-data
leaseSeconds: 30
worker:
  replicas: 2
  pool: default
  runtimeVersion: "0.3.0"
  slots: 1
  cpu: 2
  memoryMB: 1024
  interval: 2
  stopGrace: 5
  runnerDagWorkers: 2
  runnerMapWorkers: 4
  runnerMaxTasks: 100
  resources:
    requests: {cpu: "2", memory: "1536Mi"}
    limits: {cpu: "2", memory: "1536Mi"}
  nodeSelector: {}
  tolerations: []
control:
  resources:
    requests: {cpu: "250m", memory: "256Mi"}
    limits: {cpu: "1", memory: "512Mi"}

# Optional independently built static console + same-origin API reverse proxy.
console:
  enabled: false
  image:
    repository: ghcr.io/tan90degrees/dataflowcore-console
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: "50m", memory: "32Mi"}
    limits: {cpu: "250m", memory: "128Mi"}
# Only needed for a browser calling the control API directly across origins.
corsOrigins: []
