apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-control
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: "{{ .Release.Name }}-control"}
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}-control"}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: control
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [control, --host, "0.0.0.0", --data-root, /dataflow, --lease, "{{ .Values.leaseSeconds }}"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: DATAFLOW_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: "{{ .Values.existingSecret }}", key: database-url}
            - name: DATAFLOW_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: "{{ .Values.existingSecret }}", key: admin-token}
            - name: DATAFLOW_WORKER_TOKEN
              valueFrom:
                secretKeyRef: {name: "{{ .Values.existingSecret }}", key: worker-token}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.control.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /dataflow, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: "{{ .Values.existingDataClaim }}"}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-control
spec:
  selector: {app: "{{ .Release.Name }}-control"}
  ports: [{name: http, port: 8080, targetPort: http}]
