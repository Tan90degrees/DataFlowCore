apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: "{{ .Release.Name }}-worker"}
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}-worker"}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: "{{ .Release.Name }}-worker"}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      nodeSelector:
        {{- toYaml .Values.worker.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.worker.tolerations | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - worker
            - --url
            - "http://{{ .Release.Name }}-control:8080"
            - --slots
            - {{ if eq (toString .Values.worker.slots) "auto" }}"auto"{{ else }}"{{ .Values.worker.slots | int64 }}"{{ end }}
            - --cpu
            - "{{ .Values.worker.cpu | int64 }}"
            - --memory-mb
            - "{{ .Values.worker.memoryMB | int64 }}"
            - --pool
            - "{{ .Values.worker.pool }}"
            - --runtime-version
            - "{{ .Values.worker.runtimeVersion }}"
            - --interval
            - "{{ .Values.worker.interval }}"
            - --stop-grace
            - "{{ .Values.worker.stopGrace }}"
            - --runner-dag-workers
            - {{ if eq (toString .Values.worker.runnerDagWorkers) "auto" }}"auto"{{ else }}"{{ .Values.worker.runnerDagWorkers | int64 }}"{{ end }}
            - --runner-map-workers
            - "{{ .Values.worker.runnerMapWorkers | int64 }}"
            - --runner-max-tasks
            - "{{ .Values.worker.runnerMaxTasks | int64 }}"
            - --runner-io-workers
            - "{{ dig "runnerIoWorkers" 16 .Values.worker | int64 }}"
            - --runner-io-map-workers
            - "{{ dig "runnerIoMapWorkers" 16 .Values.worker | int64 }}"
            - --io-concurrency
            - "{{ dig "ioConcurrency" 32 .Values.worker | int64 }}"
            - --resource-aging-seconds
            - "{{ dig "resourceAgingSeconds" 2 .Values.worker }}"
          startupProbe:
            exec: {command: [dataflow, worker-health]}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec: {command: [dataflow, worker-health]}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec: {command: [dataflow, worker-health, --ready]}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /dataflow}
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: "{{ .Values.existingDataClaim }}"}
        - name: work
          emptyDir: {sizeLimit: 2Gi}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
