name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: dataflow-test
          POSTGRES_DB: dataflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dataflow -d dataflow"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATAFLOW_TEST_DATABASE_URL: postgresql://dataflow:dataflow-test@localhost:5432/dataflow
      PSYCOPG_IMPL: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
      - run: sudo apt-get update && sudo apt-get install -y libpq5
      - run: python -m pip install -c constraints/production.txt -e '.[postgres,dev]'
      - run: ruff check . && ruff format --check .
      - run: dataflow doctor
      - run: python -c 'import psycopg; import sys; assert not sys._is_gil_enabled()'
      - run: pytest -q
      - name: PostgreSQL business benchmark
        run: |
          python scripts/business_benchmark.py --files 24 --workers 2 --slots 4 --dsn "$DATAFLOW_TEST_DATABASE_URL" --output .e2e/business-postgres.json
          python scripts/business_benchmark.py --files 120 --workers 2 --slots 4 --chars 2048 --dsn "$DATAFLOW_TEST_DATABASE_URL" --output .e2e/business-batch-120.json
          python scripts/benchmark_operator_scheduling.py --files 8 --repetitions 1 --dsn "$DATAFLOW_TEST_DATABASE_URL" --output-dir .e2e/operators
      - uses: actions/checkout@v4
        with:
          ref: fe536bac72f6cd16cc1c4c347e4b8f27b6621dde
          path: .e2e/baseline-0.6
      - name: Internal component efficiency regression
        run: |
          python scripts/benchmark_internal.py --baseline-source .e2e/baseline-0.6 --repetitions 2 --files 16 --interval 2 --idle-seconds 8 --dsn "$DATAFLOW_TEST_DATABASE_URL" --output .e2e/internal-efficiency/default.json
          python scripts/verify_efficiency.py .e2e/internal-efficiency/default.json
      - uses: actions/checkout@v4
        with:
          ref: 8155264073b0cc3cab8abe6295d3aa0666381d14
          path: .e2e/baseline-0.7
      - name: Large DAG correctness and overhead regression
        run: |
          PYTHONPATH="$PWD/.e2e/baseline-0.7/src" python scripts/benchmark_dag.py --steps 1000 --repetitions 2 --output .e2e/dag-runtime/before.json
          python scripts/benchmark_dag.py --steps 1000 --repetitions 2 --output .e2e/dag-runtime/after.json
          python scripts/verify_dag_efficiency.py .e2e/dag-runtime/before.json .e2e/dag-runtime/after.json
          python -c 'import json; print(json.dumps(json.load(open(".e2e/internal-efficiency/default.json"))["summary"]))'
      - name: Native PostgreSQL and shared-file restore drill
        run: python scripts/verify_backup_restore.py --dsn "$DATAFLOW_TEST_DATABASE_URL" --pg-container "${{ job.services.postgres.id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-performance
          path: |
            .e2e/business-*.json
            .e2e/operators/*.json
            .e2e/backup-restore-evidence.json
            .e2e/internal-efficiency/*.json
            .e2e/dag-runtime/*.json
          include-hidden-files: true
      - run: python -m build
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: helm lint charts/dataflowcore && helm template demo charts/dataflowcore --set console.enabled=true > /tmp/rendered.yaml
      - run: python scripts/verify_chart.py /tmp/rendered.yaml
      - run: helm lint charts/dataflowcore -f charts/dataflowcore/values-production.yaml && helm template demo charts/dataflowcore -f charts/dataflowcore/values-production.yaml --set monitoring.enabled=true --set networkPolicy.enabled=true --set ingress.enabled=true > /tmp/production.yaml
      - run: python scripts/verify_chart.py /tmp/production.yaml
      - run: helm package charts/dataflowcore --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
      - run: docker build -t dataflowcore:e2e .
      - run: docker build -t dataflowcore-console:e2e frontend
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
          version: v0.27.0
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: bash e2e/run.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl logs deployment/dataflowcore-control --all-containers --tail=200 || true
          kubectl logs -l app=dataflowcore-worker --all-containers --tail=200 || true
          kubectl logs deployment/dataflowcore-console --all-containers --tail=100 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: .e2e/evidence.json
          include-hidden-files: true

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e .
      - run: npm ci && npm run check && npm run test:dev
        working-directory: frontend
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
        env:
          DATAFLOW_TEST_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-browser-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
      - run: docker build -t dataflowcore-console:e2e frontend
