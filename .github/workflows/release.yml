name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate tag and derive image names
        id: version
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('release tag must be vMAJOR.MINOR.PATCH')
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if tag != 'v' + version:
              raise SystemExit('release tag does not match the package version')
          console = json.loads(Path('frontend/package.json').read_text())['version']
          image = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'core={image}:{version}\nconsole={image}-console:{console}\n')
          PY
      - name: Reserve a draft release without replacing a published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release-state.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          if not json.load(open('/tmp/release-state.json'))['isDraft']:
              raise SystemExit('published versions are immutable; create a new version')
          PY
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: core
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.core }}
          sbom: true
          provenance: mode=max
      - uses: docker/build-push-action@v6
        id: console
        with:
          context: frontend
          push: true
          tags: ${{ steps.version.outputs.console }}
          sbom: true
          provenance: mode=max
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Publish verified packages and image digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_IMAGE: ${{ steps.version.outputs.core }}
          CORE_DIGEST: ${{ steps.core.outputs.digest }}
          CONSOLE_IMAGE: ${{ steps.version.outputs.console }}
          CONSOLE_DIGEST: ${{ steps.console.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = {k.lower(): os.environ[k] for k in ('CORE_IMAGE','CORE_DIGEST','CONSOLE_IMAGE','CONSOLE_DIGEST')}
          Path('dist/images.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('dist')
          lines = [hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name
                   for path in sorted(root.iterdir()) if path.is_file() and path.name != 'SHA256SUMS']
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          PY
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
